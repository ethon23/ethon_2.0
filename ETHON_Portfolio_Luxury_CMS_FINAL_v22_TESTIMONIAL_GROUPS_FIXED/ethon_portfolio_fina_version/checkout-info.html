<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout Information</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b12;--panel:#0e1420;--line:#202a3a;--text:#f7f8fb;--muted:#8d98aa;--purple:#7137f4;--green:#55e58d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 78% 0,rgba(112,55,244,.15),transparent 34%),#070b12;color:var(--text);font-family:Poppins,system-ui,sans-serif}.wrap{width:min(760px,calc(100% - 28px));margin:auto}.top{padding:18px 0}.back{color:#a889ff;text-decoration:none;font-size:11px}.checkout{padding:22px 0 60px}.card{border:1px solid var(--line);background:linear-gradient(145deg,#101722,#0b111a);border-radius:10px;padding:22px;box-shadow:0 25px 70px rgba(0,0,0,.28)}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:9px;color:#b99aff;font-weight:700}.title{font-size:clamp(28px,5vw,42px);line-height:1.05;letter-spacing:-.04em;margin:10px 0 6px}.muted{color:var(--muted);font-size:11px;line-height:1.7}.selected{display:flex;align-items:center;gap:10px;margin-top:15px;padding:10px 12px;border:1px solid rgba(117,66,239,.35);border-radius:8px;background:#11101d}.selected img{width:34px;height:34px;border-radius:8px;object-fit:cover}.selected strong{font-size:11px}.selected span{display:block;color:#8d98aa;font-size:8px;margin-top:2px}.form{display:grid;gap:10px;margin-top:18px}.field{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:7px;background:#080d15;color:#fff;outline:0;font-size:11px}.field:focus{border-color:#7040ef;box-shadow:0 0 0 3px rgba(112,64,239,.1)}label{display:block;color:#c7ced9;font-size:9px;font-weight:600}.field-label{display:block;margin-bottom:5px}.btn{width:100%;display:flex;align-items:center;justify-content:center;text-align:center;gap:0;border:1px solid rgba(255,255,255,.08);border-radius:7px;padding:11px 13px;background:linear-gradient(135deg,#7435f2,#5423c8);color:#fff;font-weight:700;font-size:10px;cursor:pointer;text-decoration:none}.success{display:none;margin-top:10px;padding:10px;border-radius:7px;background:rgba(85,229,141,.08);color:#80eeaa;font-size:10px}.status{margin-top:10px;font-size:9px;color:#8995a6}.summary{display:grid;gap:8px;margin-top:14px}.summary-row{display:flex;justify-content:space-between;gap:15px;padding:9px 10px;border-radius:7px;background:#0a1018;font-size:9px}.summary-row span{color:#7f8a9b}
</style></head>
<body><div class="wrap top"><a class="back" href="checkout.html">← Back to payment methods</a></div>
<main class="checkout"><div class="wrap"><section class="card"><div class="eyebrow">Checkout information</div><h1 class="title">Complete your <span style="color:#b993ff">payment request.</span></h1><p class="muted">Enter your information below to continue with your selected payment method.</p><div class="selected"><img id="gatewayLogo" src="assets/payment-gateways/Stripe.png" alt=""><div><strong id="gatewayName">Stripe</strong><span id="gatewayMethod">STRIPE CARD</span></div></div>
<form id="checkoutForm" class="form"><label><span class="field-label">Full name</span><input class="field" id="name" required placeholder="Your name"></label><label><span class="field-label">Email</span><input class="field" id="email" type="email" required placeholder="you@example.com"></label><div style="display:grid;grid-template-columns:1fr 120px;gap:8px"><label><span class="field-label">Project amount</span><input class="field" id="amount" type="number" min="1" required placeholder="e.g. 500"></label><label><span class="field-label">Currency</span><select class="field" id="currency"><option value="USD">USD $</option><option value="BDT">BDT ৳</option></select></label></div><label><span class="field-label">Service</span><select class="field" id="service"></select></label><label><span class="field-label">Project details</span><textarea class="field" id="message" rows="4" placeholder="Briefly describe your project..."></textarea></label><button id="checkoutButton" class="btn" type="submit">Continue to payment</button></form><div id="success" class="success"></div><div class="summary"><div class="summary-row"><span>Payment method</span><b id="summaryMethod">—</b></div><div class="summary-row"><span>Amount</span><b id="summaryAmount">—</b></div><div class="summary-row"><span>Service</span><b id="summaryService">—</b></div><div class="summary-row"><span>Payment request</span><b id="summaryId">Not created</b></div></div><div id="status" class="status"></div></section></div></main>
<script>
let SETTINGS={};const $=id=>document.getElementById(id),set=(id,v)=>{const e=$(id);if(e)e.textContent=v};
const logos={Stripe:'assets/payment-gateways/Stripe.png','PayPal':'assets/payment-gateways/Paypal.png','Payoneer':'assets/payment-gateways/Payoneer.png','Google Pay':'assets/payment-gateways/GooglePay.png','Binance Pay':'assets/payment-gateways/Binance.jpg','bKash':'assets/payment-gateways/bkash.png'};
function fillService(list){const opts=String(list||'UI/UX Design|Mobile App UI/UX|Frontend Development|Website / Landing Page|UI/UX + Frontend Development').split('|').map(x=>x.trim()).filter(Boolean);$('service').innerHTML=opts.map(x=>`<option>${x}</option>`).join('');set('summaryService',$('service').value||'—')}
function fillCurrency(list,cur){const supported=String(list||'USD|BDT').split('|').map(x=>x.trim().toUpperCase()).filter(x=>x==='USD'||x==='BDT');$('currency').innerHTML=(supported.length?supported:['USD','BDT']).map(x=>`<option value="${x}">${x==='USD'?'USD $':'BDT ৳'}</option>`).join('');$('currency').value=String(cur||supported[0]||'USD').toUpperCase()}
async function init(){const method=sessionStorage.getItem('selectedPaymentGateway')||'STRIPE CARD',name=sessionStorage.getItem('selectedPaymentGatewayName')||'Stripe';set('gatewayName',name);set('gatewayMethod',method);set('summaryMethod',name);$('gatewayLogo').src=logos[name]||logos.Stripe;fillService();fillCurrency();try{const r=await fetch('/api/public',{cache:'no-store'});const d=await r.json();SETTINGS=d.settings||{};fillService(SETTINGS.checkoutServiceOptions);fillCurrency(SETTINGS.paymentCurrencies,SETTINGS.paymentCurrency);set('checkoutButton',String(SETTINGS.checkoutButtonText||'Continue to payment').replace(/[→↗➜➝⟶]+/g,'').trim())}catch(e){console.warn(e)}}
$('amount').addEventListener('input',()=>set('summaryAmount',$('amount').value?$('amount').value+' '+$('currency').value:'—'));$('currency').addEventListener('change',()=>set('summaryAmount',$('amount').value?$('amount').value+' '+$('currency').value:'—'));$('service').addEventListener('change',()=>set('summaryService',$('service').value||'—'));
$('checkoutForm').addEventListener('submit',async e=>{e.preventDefault();const b={name:$('name').value.trim(),email:$('email').value.trim(),amount:$('amount').value,currency:$('currency').value,service:$('service').value,method:sessionStorage.getItem('selectedPaymentGateway')||'STRIPE CARD',message:$('message').value.trim()};try{const r=await fetch('/api/payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json();if(!r.ok)throw Error(j.error||'Unable to create payment request');set('success','Payment request created successfully. Your request has been sent to the admin inbox.');$('success').style.display='block';set('summaryAmount',b.amount+' '+b.currency);set('summaryService',b.service);set('summaryId',j.paymentRequestId||'Created');set('status','Payment request submitted.')}catch(err){set('status',err.message)}});init();
</script></body></html>
